<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlexiPay Console</title>
<meta name="color-scheme" content="light dark">
<style>:root{color-scheme:light}body{margin:0}</style>

<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: left rail console (Dashboard, Payments, New payment, Recipients, Where we pay, Take payment, Pay from, Wallet, Developers) + working area. Pounds first (tGBP on Solana), USDC as the dollar fallback. */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface2:#eceff5; --ink:#111a2b; --muted:#5a6579; --line:#dde2ea;
  --brand:#2850d9; --brand-ink:#ffffff; --brand-soft:#e5ebff; --accent:#ff6a3d;
  --ok:#0f7a58; --ok-soft:#d9f4ea; --warn:#9a5700; --warn-soft:#ffefd2; --bad:#bf2a39; --bad-soft:#fde3e6;
  --shadow:0 1px 2px rgba(17,26,43,.06),0 10px 28px rgba(17,26,43,.07);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --body:'Instrument Sans','Segoe UI',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1322; --surface:#131c31; --surface2:#1a2540; --ink:#e9edf7; --muted:#9aa7bf; --line:#25314e;
  --brand:#7b97ff; --brand-ink:#0a1020; --brand-soft:#1d2a57; --accent:#ff8a63;
  --ok:#53d8a8; --ok-soft:#10312a; --warn:#ffc064; --warn-soft:#3a2b10; --bad:#ff7d8c; --bad-soft:#3a1520;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1322; --surface:#131c31; --surface2:#1a2540; --ink:#e9edf7; --muted:#9aa7bf; --line:#25314e;
  --brand:#7b97ff; --brand-ink:#0a1020; --brand-soft:#1d2a57; --accent:#ff8a63;
  --ok:#53d8a8; --ok-soft:#10312a; --warn:#ffc064; --warn-soft:#3a2b10; --bad:#ff7d8c; --bad-soft:#3a1520;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;align-self:start}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.02em}
.mark{width:30px;height:30px;border-radius:9px;background:var(--brand);position:relative;flex:none}
.mark::after{content:"";position:absolute;inset:7px;border-radius:50%;border:3px solid var(--brand-ink);border-right-color:var(--accent);transform:rotate(-30deg)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav svg{width:19px;height:19px;flex:none}
.rail .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:12.5px;color:var(--muted)}
.env{display:flex;gap:8px;align-items:center;background:var(--warn-soft);color:var(--warn);padding:8px 10px;border-radius:10px;font-weight:600;font-size:12.5px}
.env i{width:8px;height:8px;border-radius:50%;background:currentColor}
.theme{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;text-align:left}
main{padding:26px max(20px,env(safe-area-inset-right,0px)) 60px 28px;min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px}
h1{font-family:var(--display);font-size:30px;line-height:1.1;margin:0;letter-spacing:-.025em;text-wrap:balance}
h2{font-family:var(--display);font-size:18px;margin:0;letter-spacing:-.01em}
h3{font-size:14px;margin:0;font-weight:600}
.sub{color:var(--muted);margin:6px 0 0}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 15px;border-radius:10px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--brand)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi small{color:var(--muted);font-weight:500}
.kpi b{font-family:var(--display);font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.delta{font-size:12.5px;font-weight:600;color:var(--ok)}
.delta.dn{color:var(--bad)}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr[data-pay]{cursor:pointer}
.tbl tr[data-pay]:hover td{background:var(--surface2)}
.tbl td.num,.tbl th.num{text-align:right}
.scroll{overflow-x:auto}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--brand-soft);color:var(--brand)}
.sim{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--warn);background:var(--warn-soft);padding:2px 7px;border-radius:6px;font-weight:500}
.mono{font-family:var(--mono);font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 13px;border-radius:99px;font-weight:500;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=text],input[type=search],select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec>header{display:flex;gap:10px;align-items:center}
.sec>header i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;background:var(--surface);text-align:left;width:100%}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.opt .ic{width:36px;height:36px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;flex:none;color:var(--brand)}
.opt[aria-pressed="true"] .ic{background:var(--surface)}
.opt .ic svg{width:19px;height:19px}
.opt b{display:block}
.opt span.d{color:var(--muted);font-size:13.5px}
.opt .r{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.amt span{padding:0 14px;color:var(--muted);font-weight:600}
.amt input{border:0;font-family:var(--display);font-size:30px;font-weight:700;padding:10px 6px;background:none;width:100%;outline:none}
.route{display:flex;flex-direction:column;gap:0}
.leg{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;padding:10px 0;position:relative}
.leg::before{content:"";position:absolute;left:13px;top:34px;bottom:-8px;width:2px;background:var(--line)}
.leg:last-child::before{display:none}
.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted);font-size:12px;font-weight:700;z-index:1}
.dot.done{background:var(--ok);color:var(--surface)}
.dot.now{background:var(--brand);color:var(--brand-ink)}
.dot.bad{background:var(--bad);color:var(--surface)}
.leg p{margin:0;color:var(--muted);font-size:13.5px}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.row:last-child{border:0}
.row.tot{font-weight:700;font-size:16px}
.note{background:var(--surface2);border-radius:10px;padding:11px 13px;font-size:13.5px;color:var(--muted)}
.note b{color:var(--ink)}
pre.code{background:#0d1526;color:#d8e2ff;border-radius:12px;padding:15px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.6;margin:0}
.copyrow{display:flex;gap:8px;align-items:center}
.copyrow input{font-family:var(--mono);font-size:13px}
.empty{padding:34px;text-align:center;color:var(--muted)}
.phonewrap{display:grid;place-items:center;padding:6px}
.phone{width:min(100%,340px);border:9px solid #1b2236;border-radius:38px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow);min-height:600px;display:flex;flex-direction:column}
.phone .bar{height:26px;background:#1b2236}
.phone .in{padding:20px 18px;display:flex;flex-direction:column;gap:14px;flex:1}
.phone .big{font-family:var(--display);font-size:34px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:5px;height:140px}
.bars div{flex:1;background:var(--brand-soft);border-radius:5px 5px 0 0;min-height:4px;position:relative}
.bars div.hi{background:var(--brand)}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);z-index:20}
.two{display:flex;gap:10px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:13px}
.acc{display:flex;flex-direction:column;gap:12px}
.acc .top2{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.acc .ic{width:42px;height:42px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.acc .ic svg{width:22px;height:22px}
.bal{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.hero{background:linear-gradient(135deg,#1c3fb8 0%,#2850d9 45%,#5b3fd1 100%);color:#fff;border-radius:18px;padding:24px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%)}
.hero h2{color:#fff;font-size:15px;font-weight:600;opacity:.85}
.hero .big2{font-family:var(--display);font-size:42px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;margin:6px 0 14px}
.hero .accs{display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.hero .a{display:flex;justify-content:space-between;gap:10px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);padding:10px 13px;border-radius:12px;font-variant-numeric:tabular-nums;backdrop-filter:blur(2px)}
.hero .btn{background:#fff;color:#1c3fb8;border-color:#fff}
.hero .btn.o{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.feed{display:flex;flex-direction:column}
.feed .ev{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.feed .ev:last-child{border:0}
.feed .ev .ic2{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);color:var(--muted)}
.feed .ev .ic2.ok{background:var(--ok-soft);color:var(--ok)}.feed .ev .ic2.bad{background:var(--bad-soft);color:var(--bad)}.feed .ev .ic2.info{background:var(--brand-soft);color:var(--brand)}.feed .ev .ic2.warn{background:var(--warn-soft);color:var(--warn)}
.feed .ev .ic2 svg{width:17px;height:17px}
.feed .ev p{margin:0;font-size:13px;color:var(--muted)}
.feed .ev time{font-size:12.5px;color:var(--muted);white-space:nowrap}
.dayh{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:16px 0 2px}
.stat{display:flex;flex-direction:column;gap:2px}.stat small{color:var(--muted)}.stat b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.plus{color:var(--ok);font-weight:600}.minus{color:var(--ink);font-weight:600}
.switch{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border:0}
.tg{width:42px;height:24px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none;padding:0}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.tg[aria-pressed="true"]{background:var(--brand)}.tg[aria-pressed="true"]::after{transform:translateX(18px)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:none}
.who{display:flex;gap:10px;align-items:center}
.pv{background:var(--brand);color:var(--brand-ink);font-size:13px;font-weight:600;text-align:center;padding:6px 16px;line-height:1.35;margin:0}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .ic{background:var(--surface)}
.save{margin:10px 0 0;font-weight:700;color:var(--ok)}
.bigtap{width:100%;justify-content:center;padding:22px 18px;font-size:20px;border-radius:14px}
.tillqr{background:#fff;padding:14px;border-radius:14px;width:min(100%,268px);aspect-ratio:1;display:grid;place-items:center;margin:0 auto}
.tillqr img,.tillqr canvas{max-width:100%;height:auto}
.till-amt{font-family:var(--display);font-size:44px;font-weight:800;letter-spacing:-.03em;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
.paidbox{text-align:center;padding:26px 0 10px}
.paidbox .dot{width:96px;height:96px;font-size:46px;margin:0 auto 14px}
.card.paid{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.ctry{display:flex;justify-content:space-between;gap:6px 12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ctry:last-child{border:0}
.ctry>span:last-child{text-align:right;margin-left:auto}
.wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));column-gap:24px}
.wlist .ctry:last-child{border-bottom:1px solid var(--line)}
@media (max-width:900px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px max(16px,env(safe-area-inset-left,0px));gap:8px}
  .brand{padding:0 10px 0 0}
  .nav{flex-direction:row;overflow-x:auto;max-width:100%}
  .nav button{white-space:nowrap}
  .rail .foot{display:none}
  main{padding:20px max(16px,env(safe-area-inset-right,0px)) 50px max(16px,env(safe-area-inset-left,0px))}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.g2e,.g3{grid-template-columns:minmax(0,1fr)}
  h1{font-size:25px}
}
@media (prefers-reduced-motion:no-preference){.view{animation:in .25s ease}@keyframes in{from{opacity:.4;transform:translateY(5px)}}}
</style>

<script>
/* ---------- data ---------- */
const SYM = {GBP:'£', USD:'$', PHP:'₱', BRL:'R$', KES:'KSh ', INR:'₹', VND:'₫', EUR:'€'};
const DEC = {VND:0};
const TOKEN = {GBP:'tGBP', USD:'USDC'};
const TOKENS = ['tGBP','USDC'];
/* Where we pay: local bank payouts, one world list */
const WORLD = [
  ['Europe',[['AD','Andorra','EUR'],['AT','Austria','EUR'],['BE','Belgium','EUR'],['BG','Bulgaria','EUR'],['HR','Croatia','EUR'],['CY','Cyprus','EUR'],['CZ','Czechia','CZK'],['DK','Denmark','DKK'],['EE','Estonia','EUR'],['FI','Finland','EUR'],['FR','France','EUR'],['DE','Germany','EUR'],['GR','Greece','EUR'],['HU','Hungary','HUF'],['IS','Iceland','ISK'],['IE','Ireland','EUR'],['IT','Italy','EUR'],['LV','Latvia','EUR'],['LI','Liechtenstein','CHF'],['LT','Lithuania','EUR'],['LU','Luxembourg','EUR'],['MT','Malta','EUR'],['NL','Netherlands','EUR'],['NO','Norway','NOK'],['PL','Poland','PLN'],['PT','Portugal','EUR'],['RO','Romania','RON'],['SK','Slovakia','EUR'],['SI','Slovenia','EUR'],['ES','Spain','EUR'],['SE','Sweden','SEK'],['CH','Switzerland','CHF']]],
  ['Asia',[['BD','Bangladesh','BDT'],['CN','China','CNY'],['HK','Hong Kong','HKD'],['IN','India','INR'],['ID','Indonesia','IDR'],['MY','Malaysia','MYR'],['NP','Nepal','NPR'],['PK','Pakistan','PKR'],['PH','Philippines','PHP'],['SG','Singapore','SGD'],['KR','South Korea','KRW'],['LK','Sri Lanka','LKR'],['TH','Thailand','THB'],['VN','Vietnam','VND']]],
  ['Africa',[['DZ','Algeria','DZD'],['GH','Ghana','GHS'],['KE','Kenya','KES'],['MA','Morocco','MAD'],['NG','Nigeria','NGN'],['ZA','South Africa','ZAR'],['UG','Uganda','UGX']]],
  ['Americas',[['AR','Argentina','ARS'],['BR','Brazil','BRL'],['CA','Canada','CAD'],['CL','Chile','CLP'],['CO','Colombia','COP'],['MX','Mexico','MXN'],['PE','Peru','PEN'],['UY','Uruguay','UYU']]],
  ['Middle East',[['TR','Türkiye','TRY'],['AE','United Arab Emirates','AED']]],
  ['Oceania',[['AU','Australia','AUD']]]
];
const COUNTRY = {}, CCY = {};
WORLD.forEach(([,cs])=>cs.forEach(([c,n,k])=>{COUNTRY[c]=n;CCY[c]=k}));
const partnersOf = c => c==='CO' ? ['BlindPay'] : ['BR','MX','AR'].includes(c) ? ['Tazapay','BlindPay'] : ['Tazapay'];
const PARTNERS = {Tazapay:'Bank payouts in many countries', BlindPay:'Latin America: Brazil, Mexico, Colombia, Argentina'};
/* Real sandbox quotes: what the recipient gets for 100 of the sending currency. p:null = another eligible route */
const ROUTES = {
  'GBP:KE':[{p:'Tazapay', per100:15778.86}],

/* ---------- quote engine: compares every eligible route, best for the recipient first ---------- */
function quote({amount,from,rid,method='bank',feePayer='sender'}){
  const r = rec(rid), a = acct(from), amt = Number(amount)||0, cur = a.cur, tok = TOKEN[cur], rp = feePayer==='recipient', fp = amt*FP_FEE;
  const mk = (p,pf,recvOf,est) => {const fees=pf+fp, net=rp?Math.max(amt-fees,0):amt; return {p, pf, fees, net, recv:recvOf(net), total:rp?amt:amt+fees, est}};
  let routes, rcur, wallet = WALLET_M.includes(method);
  if(wallet){ rcur = tok; routes = [mk(null,0,n=>n,false)]; }
  else { rcur = r.cur; const direct = ROUTES[cur+':'+r.country];
    routes = direct ? direct.map(x=>mk(x.p, amt*(x.fee??PARTNER_FEE)/100, n=>x.per100*n/100, false))
                    : [mk(partnersOf(r.country).at(-1)==='BlindPay'?'BlindPay':'Tazapay', amt*PARTNER_FEE/100, n=>conv(n,cur,r.cur), true)];
    routes.sort((x,y)=>y.recv-x.recv); }
  const best = routes[0], next = routes[1]||null;
  return {amt, cur, tok, rcur, routes, best, next, saving: next ? best.recv-next.recv : 0, partner: best.p, pf: best.pf, fp, fees: best.fees, total: best.total, net: best.net, recv: best.recv, est: best.est, wallet, method, feePayer};
}
/* what a claim-link recipient gets in the currency they pick */
function claimAmt(p,ccy){const a=acct(p.from),amt=p.amount,fees=amt*FP_FEE+(TOKENS.includes(ccy)?0:amt*PARTNER_FEE/100),net=p.feePayer==='recipient'?Math.max(amt-fees,0):amt;return conv(net,a.cur,ccy)}
function qp(p){
  const q = quote({amount:p.amount, from:p.from, rid:p.rid, method:p.method||'bank', feePayer:p.feePayer});
  if(p.claim && p.ccy && p.ccy!==q.rcur){ q.recv = claimAmt(p,p.ccy); q.rcur = p.ccy; q.best = {...q.best, recv:q.recv}; q.routes = [q.best]; q.next = null; q.est = true; }
  return q;
}

}

  const tq=$('#tillqr'); if(tq) qrInto(tq,'solana:'+M_ADDR+'?amount='+(Number(S.till.amount)||0).toFixed(2)+'&label=Sample%20Caf%C3%A9&message=tGBP',240);
}
function resetClaim(pid){const p=payments.find(x=>x.id===pid);if(p&&p.claim){p.status='awaiting_claim';p.method='bank';delete p.ccy}}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-wact],[data-wf],[data-feepayer],[data-rec],[data-acc],[data-afilter],[data-toggle],[data-go],[data-pay],[data-filter],[data-from],[data-mode],[data-method],[data-act],[data-copy],[data-default],[data-link],[data-pay-to],[data-pay-open],[data-choice],[data-ccy]');
  if(!t) return;
  const d=t.dataset;
  if(t.tagName==='A') e.preventDefault();
  if(d.wact){S.wallet.act=d.wact;S.wallet.qrStep=0;return draw()}
  if(d.wf){S.whereF=d.wf;return draw()}
  if(d.feepayer){S.wiz.feePayer=d.feepayer;return draw()}
  if(d.rec) return go('recipient',{recId:d.rec});
  if(d.acc) return go('account',{accId:d.acc});
  if(d.afilter){S.actFilter=d.afilter;return draw()}
  if(d.toggle){S.toggles[d.toggle]=!S.toggles[d.toggle];return draw()}
  if(d.go){if(d.go==='new')S.wiz.sent=null;if(d.go==='claimprev')S.claim.step=0;return go(d.go)}
  if(d.pay) return go('detail',{payId:d.pay});
  if(d.filter){S.filter=d.filter;return draw()}
  if(d.from){S.wiz.from=d.from;return draw()}
  if(d.mode){S.wiz.mode='claim';return draw()}
  if(d.method){S.wiz.mode='direct';S.wiz.method=d.method;return draw()}
  if(d.ccy){S.claim.ccy=d.ccy;return draw()}
  if(d.choice){S.claim.choice=d.choice;S.claim.step=1;return draw()}
  if(d.copy) return copy(d.copy);
  if(d.default){accounts.forEach(a=>a.def=a.id===d.default);toast('Default account updated');return draw()}
  if(d.link){S.linking='wait';draw();setTimeout(()=>{if(S.view!=='accounts')return;const kinds={bank:['Savings account','UK bank account · ••• 7312',12400,'Bank transfer, sent on as tGBP','GBP'],tgbp:['Second treasury wallet','Solana · tGBP · 9pQr…Lm3T',5200,'tGBP on Solana','GBP'],usdc:['Dollar wallet 2','Solana · USDC · 3Fk8…Wq2D',2300,'USDC on Solana (dollar fallback)','USD'],flexi:['FlexiPay wallet 2','Embedded wallet · tGBP',0,'tGBP on Solana','GBP']};const k=kinds[d.link];accounts.push({id:'acc_'+Date.now(),type:d.link,name:k[0],detail:k[1],balance:k[2],rail:k[3],cur:k[4],def:false});S.linking='done';draw()},900);return}
  if(d.payTo){S.wiz.rid=d.payTo;S.wiz.sent=null;return go('new')}
  if(d.payOpen) return go('detail',{payId:d.payOpen});
  switch(d.act){
    case 'send':{const w=S.wiz,amt=Number(w.amount);if(!(amt>0)){toast('Enter an amount');return}
      const claim=w.mode==='claim', method=claim?'bank':w.method, id='pay_'+Math.random().toString(36).slice(2,7).toUpperCase();
      payments.unshift({id,rid:w.rid,amount:amt,from:w.from,method,feePayer:w.feePayer,status:claim?'awaiting_claim':'processing',when:'Just now',claim});
      w.sent={id,amount:amt,from:w.from,rid:w.rid,method,feePayer:w.feePayer,claim,token:Math.random().toString(36).slice(2,14)};
      if(claim) S.claim={step:0,choice:null,ccy:null,pid:id};
      return draw()}
    case 'again':S.wiz.sent=null;return draw();
    case 'openclaim':S.claim={step:0,choice:null,ccy:null,pid:d.id};return go('claimprev');
    case 'claimgo':{const p=payments.find(x=>x.id===S.claim.pid);if(p){p.status='completed';p.method=S.claim.choice;p.ccy=S.claim.ccy||rec(p.rid).cur}S.claim.step=2;return draw()}
    case 'claimback':S.claim.step=0;return draw();
    case 'claimreset':resetClaim(S.claim.pid);S.claim.step=0;S.claim.choice=null;S.claim.ccy=null;return draw();
    case 'qrsample':S.wallet.qrStep=1;return draw();
    case 'qrcancel':S.wallet.qrStep=0;return draw();
    case 'qrpay':{const a=acct('acc_flexi');a.balance-=4.5;S.wallet.tx.unshift({t:'Just now',label:'Paid Sample Café by QR',amt:-4.5});S.wallet.qrStep=0;toast('Paid £4.50 in tGBP (simulated)');return draw()}
    case 'tillpaid':{const amt=Number(S.till.amount);if(!(amt>0)){toast('Enter the sale amount');return}S.till.sales.unshift({t:'Just now',amt});S.till.paid=amt;return draw()}
    case 'tillnew':S.till.paid=false;return draw();
    case 'cashout':{const tot=S.till.sales.reduce((s,x)=>s+x.amt,0);if(!tot){toast('Nothing to cash out yet');return}S.till.sales=[];toast('Cash out of '+gbp(tot)+' started, free of charge (simulated)');return draw()}
    case 'togglerec':S.wiz.newRec=!S.wiz.newRec;return draw();
    case 'saverec':{const id=readRecForm('n');if(!id)return;S.wiz.rid=id;S.wiz.newRec=false;return draw()}
    case 'topup':{const a=acct(d.id);a.balance+=2500;toast('Added '+fmt(2500,a.cur)+' (simulated)');return draw()}
    case 'payfrom':S.wiz.from=d.id;S.wiz.sent=null;return go('new');
    case 'dup':{const p=payments.find(x=>x.id===d.id);Object.assign(S.wiz,{from:p.from,rid:p.rid,amount:String(p.amount),mode:p.claim?'claim':'direct',method:p.method||'bank',feePayer:p.feePayer||'sender',sent:null});return go('new')}
    case 'addrec':{if(readRecForm(''))draw();return}
    case 'newkey':S.keyShown='fp_test_'+Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,14);return draw();
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;draw()}
  if(e.target.id==='amt'||e.target.id==='tillAmt'){const id=e.target.id,v=e.target.value.replace(/[^0-9.]/g,'');if(id==='amt')S.wiz.amount=v;else S.till.amount=v;const pos=e.target.selectionStart;draw();const a=$('#'+id);a.focus();a.setSelectionRange(pos,pos)}
});
document.addEventListener('change',e=>{ if(e.target.id==='rsel'){S.wiz.rid=e.target.value;draw()} });
$('#themeBtn').addEventListener('click',()=>{const r=document.documentElement;const dark=(r.dataset.theme==='dark')||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);r.dataset.theme=dark?'light':'dark'});
draw();
</script>
