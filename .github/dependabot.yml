# Security and dependency updates (PLATFORM_TRACKER 4.4). Grouped weekly PRs; each one runs CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major upgrades are planned work, not weekly chores; security updates still arrive.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly }
    # Major upgrades are planned work, not weekly chores; security updates still arrive.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
